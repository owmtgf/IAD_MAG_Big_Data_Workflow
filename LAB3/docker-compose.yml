services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns

  app:
    build: .
    volumes:
      - .:/app
    working_dir: /app/src
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: >
      sh -c "python bronze.py &&
             python silver.py &&
             python silver.py &&
             python gold.py &&
             python train.py &&
             python time_travel_demo.py &&
             python schema_evolution_demo.py"